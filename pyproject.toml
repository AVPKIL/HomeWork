[project]
name = "hw-9-1"
version = "0.1.0"
description = ""
authors = [
    {name = "AVPKIL",email = "dobrohvalov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[tool.poetry]
packages = [{include = "hw_9"}]


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exlude = '\.venv'

[tool.black]
line-length = 119
exclude = '\.git'

[tool.isort]
line_length = 119
force_grid_wrap = 0
